name: check

# Parsing tests on pages saved from pmgsy.dord.gov.in (pytest). The site answers Indian addresses only, so a scrape-check run from
# a GitHub runner only shows reachability and does not fail the check; in the pool the projects borrow an Indian proxy (proxy="IN").
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: scrape-check ji (reachability only)
        continue-on-error: true
        run: >
          scrape-check --project pmgsy-reports-ci --task crawl --env ADAPTER=ommas --timeout 600
          --item '{"key": "ji-2016", "payload": {"report": "ji", "year": 2016}}'
